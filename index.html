<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Omani Shoes | Order & Follow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #12100c;
    --gold: #e8c547;
    --gold-deep: #b8860b;
    --gold-soft: #f0d78c;
    --sun: #ffb703;
    --ink: #f4efe4;
    --muted: #9a917f;
    --card: #16140f;
    --card-line: rgba(232,197,71,.18);
    --glow: rgba(232,197,71,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); overflow-x: hidden;
    background:
      radial-gradient(80% 45% at 50% 0%, rgba(184,134,11,.18) 0%, transparent 55%),
      #0a0a0a;
  }
  body.loading { overflow: hidden; }

  .logo-wrap { position: relative; display: inline-block; line-height: 0; }
  .logo-wrap img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 0 14px rgba(232,197,71,.35));
  }

  /* ---------- Splash ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 10;
    background:
      radial-gradient(55% 45% at 50% 40%, rgba(180,120,20,.22) 0%, transparent 55%),
      #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    opacity: 1;
    transition: opacity .45s ease;
    contain: strict;
  }
  .splash.hide { opacity: 0; pointer-events: none; }
  #fx { display: none; }
  .splash-dust {
    position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,215,100,.7), transparent),
      radial-gradient(1px 1px at 28% 68%, rgba(255,230,150,.55), transparent),
      radial-gradient(1.5px 1.5px at 48% 18%, rgba(255,215,100,.65), transparent),
      radial-gradient(1px 1px at 72% 42%, rgba(255,230,150,.5), transparent),
      radial-gradient(1.5px 1.5px at 86% 76%, rgba(255,215,100,.6), transparent),
      radial-gradient(1px 1px at 18% 88%, rgba(255,230,150,.45), transparent),
      radial-gradient(1px 1px at 62% 58%, rgba(255,215,100,.5), transparent),
      radial-gradient(1.5px 1.5px at 38% 36%, rgba(255,230,150,.55), transparent);
  }
  .splash-streaks {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0;
  }
  .splash-streaks.go { animation: streaksFlash .7s ease-out forwards; }
  .splash-streaks span {
    position: absolute; left: -40%; height: 2px; width: 50%;
    background: linear-gradient(90deg, transparent, rgba(255,210,90,.8), transparent);
  }
  .splash-streaks span:nth-child(1) { top: 30%; animation: streakRun .45s .05s ease-out forwards; }
  .splash-streaks span:nth-child(2) { top: 44%; width: 65%; animation: streakRun .4s .1s ease-out forwards; }
  .splash-streaks span:nth-child(3) { top: 56%; width: 45%; animation: streakRun .48s .14s ease-out forwards; }
  .splash-streaks span:nth-child(4) { display: none; }
  @keyframes streakRun {
    from { transform: translate3d(0,0,0); opacity: 0; }
    25% { opacity: 1; }
    to { transform: translate3d(220%,0,0); opacity: 0; }
  }
  @keyframes streaksFlash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

  .splash-rings {
    position: absolute; left: 50%; top: 42%; width: min(70vw, 320px); aspect-ratio: 1;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .splash-rings i {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(255,183,3,.3);
    opacity: 0; transform: scale(.4);
  }
  .splash-rings.go i:nth-child(1) { animation: ringOut 1.1s .1s ease-out forwards; }
  .splash-rings.go i:nth-child(2) { animation: ringOut 1.1s .28s ease-out forwards; }
  .splash-rings.go i:nth-child(3) { display: none; }
  @keyframes ringOut {
    0% { opacity: 0; transform: scale(.4); }
    30% { opacity: .55; }
    100% { opacity: 0; transform: scale(1.4); }
  }

  .stage {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .emblem {
    position: relative; width: min(68vw, 280px); aspect-ratio: 1;
    opacity: 0; transform: translate3d(-80%,0,0) scale(.7);
  }
  .emblem.dash {
    animation: logoDash .85s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .emblem.live {
    opacity: 1;
    transform: none;
  }
  .emblem.live img {
    filter: drop-shadow(0 0 16px rgba(255,183,3,.45));
  }
  @keyframes logoDash {
    0% { opacity: 0; transform: translate3d(-80%,0,0) scale(.7); }
    70% { opacity: 1; transform: translate3d(4%,0,0) scale(1.03); }
    100% { opacity: 1; transform: none; }
  }
  .emblem img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; border-radius: 50%;
  }
  .emblem-shine {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0;
    background: linear-gradient(115deg, transparent 40%, rgba(255,250,220,.55) 50%, transparent 60%);
    transform: translate3d(-120%,0,0);
  }
  .emblem.shine .emblem-shine {
    opacity: 1;
    animation: shineSlide .7s ease-out forwards;
  }
  @keyframes shineSlide {
    to { transform: translate3d(120%,0,0); opacity: 0; }
  }
  .emblem-impact {
    position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
    margin: -9px; border-radius: 50%; pointer-events: none;
    background: rgba(255,220,120,.55);
    opacity: 0; transform: scale(0);
  }
  .emblem.impact .emblem-impact { animation: impactPop .45s ease-out forwards; }
  @keyframes impactPop {
    0% { opacity: .8; transform: scale(0); }
    100% { opacity: 0; transform: scale(12); }
  }

  .bname {
    display: flex; font-family: "Cinzel", Georgia, serif; font-weight: 700;
    font-size: clamp(34px, 11vw, 46px); letter-spacing: .14em; padding-left: .14em;
  }
  .bname span {
    display: inline-block; opacity: 0; transform: translate3d(0,16px,0);
    color: #ffb703;
  }
  .bname.go span { animation: letter .45s cubic-bezier(.2,.85,.2,1) forwards; }
  @keyframes letter { to { opacity: 1; transform: none; } }
  .bsub {
    display: flex; align-items: center; gap: 14px;
    font-family: "Cinzel", Georgia, serif; font-weight: 500;
    font-size: 15px; letter-spacing: .6em; padding-left: .6em;
    color: #ffd75e; opacity: 0; transform: translate3d(0,8px,0);
    transition: opacity .35s ease, transform .35s ease;
  }
  .bsub i {
    display: block; height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, #ffb703);
    transition: width .55s ease;
  }
  .bsub i:last-child { background: linear-gradient(270deg, transparent, #ffb703); }
  .bsub.go { opacity: 1; transform: none; }
  .bsub.go i { width: 44px; }
  .splash-hint {
    position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: rgba(255,215,120,.35); opacity: 0; transition: opacity .35s ease;
  }
  .splash.ready .splash-hint { opacity: 1; }

  /* ---------- Page ---------- */
  .top {
    position: relative;
    background: linear-gradient(180deg, #16130e 0%, #0e0c09 100%);
    border-radius: 0 0 36px 36px;
    padding: calc(env(safe-area-inset-top, 0px) + 26px) 22px 32px;
    display: flex; flex-direction: column; align-items: center;
    border-bottom: 1px solid rgba(232,197,71,.2);
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
    overflow: hidden;
    contain: layout paint;
  }
  .hero {
    width: min(68vw, 280px);
    opacity: 0; transform: translate3d(0,12px,0);
  }
  body.ready .hero {
    animation: heroIn .55s .08s cubic-bezier(.2,.85,.2,1) forwards;
  }
  @keyframes heroIn { to { opacity: 1; transform: none; } }
  .hero .logo-wrap { width: 100%; }
  .brand-line {
    margin-top: 10px; display: flex; align-items: center; gap: 12px;
    opacity: 0;
  }
  body.ready .brand-line { animation: fadeUp .45s .25s ease forwards; }
  .brand-line i {
    display: block; height: 1px; width: 36px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .brand-line i:last-child { background: linear-gradient(270deg, transparent, var(--gold)); }
  .brand-line span {
    font-family: "Cinzel", Georgia, serif; font-weight: 600;
    font-size: 11px; letter-spacing: .42em; padding-left: .42em;
    color: var(--gold-soft); text-transform: uppercase;
  }
  .tagline {
    margin-top: 12px; font-weight: 400; font-size: 15px; letter-spacing: .04em;
    color: var(--muted); text-align: center;
    opacity: 0; transform: translate3d(0,8px,0);
  }
  body.ready .tagline { animation: fadeUp .45s .32s ease forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }

  .page {
    max-width: 480px; margin: 0 auto;
    padding: 28px 22px calc(env(safe-area-inset-bottom, 0px) + 28px);
    min-height: calc(100% - 220px); display: flex; flex-direction: column;
  }
  .section-label {
    font-family: "Cinzel", Georgia, serif; font-size: 11px; font-weight: 600;
    letter-spacing: .35em; padding-left: .35em; color: var(--gold);
    margin-bottom: 14px; text-transform: uppercase;
    opacity: 0;
  }
  body.ready .section-label { animation: fadeUp .4s .2s ease forwards; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 15px;
    padding: 14px 16px 14px 13px; border-radius: 16px;
    color: var(--ink); text-decoration: none;
    background: #16140f;
    border: 1px solid var(--card-line);
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
    opacity: 0; transform: translate3d(0,14px,0);
    transition: transform .15s ease, border-color .15s ease;
    contain: layout paint;
  }
  body.ready .link { animation: cardIn .5s cubic-bezier(.2,.85,.2,1) forwards; }
  body.ready .link:nth-child(1) { animation-delay: .18s; }
  body.ready .link:nth-child(2) { animation-delay: .26s; }
  body.ready .link:nth-child(3) { animation-delay: .34s; }
  body.ready .link:nth-child(4) { animation-delay: .42s; }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  .link:active { transform: scale(.985); }
  .link:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .icon {
    width: 48px; height: 48px; flex: none; border-radius: 13px;
    display: grid; place-items: center;
  }
  .icon svg { width: 26px; height: 26px; fill: #fff; }
  .wa { background: #25d366; }
  .ig { background: linear-gradient(45deg, #f9a03f, #e1306c 55%, #7b3fe4); }
  .tt { background: #000; border: 1px solid rgba(255,255,255,.12); }
  .fb { background: #1877f2; }
  .label { display: flex; flex-direction: column; line-height: 1.25; gap: 2px; }
  .label b { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .label small { font-size: 13px; color: var(--muted); }
  .chev {
    margin-left: auto; width: 18px; height: 18px;
    stroke: rgba(232,197,71,.55); fill: none; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .link.primary {
    background: #1a150c;
    border-color: rgba(232,197,71,.42);
  }
  .link.primary .label small { color: rgba(240,215,140,.65); }
  .link.primary .chev { stroke: var(--gold); }
  body.ready .link.primary {
    animation: cardIn .5s .18s cubic-bezier(.2,.85,.2,1) forwards;
  }

  footer {
    margin-top: auto; padding-top: 34px;
    font-size: 12px; letter-spacing: .14em; color: var(--muted);
    text-align: center; text-transform: uppercase;
    opacity: 0;
  }
  body.ready footer { animation: fadeUp .4s .55s ease forwards; }
  footer span { color: var(--gold-soft); }

  @media (prefers-reduced-motion: reduce) {
    .splash *, body.ready .link, body.ready .hero, body.ready .tagline,
    body.ready .brand-line, body.ready .section-label, body.ready footer {
      animation: none !important; transition: none !important;
    }
    body.ready .link, body.ready .hero, body.ready .tagline,
    body.ready .brand-line, body.ready .section-label, body.ready footer,
    .emblem.live { opacity: 1; transform: none; }
  }
</style>
</head>

      emblem.classList.add("dash");
    }, 120);

    later(function () {
      emblem.classList.add("impact");
      rings.classList.add("go");
    }, 650);

    later(function () { emblem.classList.add("shine"); }, 820);
    later(function () {
      emblem.classList.remove("dash");
      emblem.classList.add("live");
    }, 980);

    later(function () { bname.classList.add("go"); }, 1050);
    later(function () { bsub.classList.add("go"); }, 1400);
    later(finish, 2800);
  }

  img.onload = function () { runCinematic(); };
  img.onerror = function () { img.src = EMBLEM; };
  img.src = SPLASH_LOGO;
  later(function () {
    if (!finished && !emblem.classList.contains("dash")) runCinematic();
  }, 400);
</script>
</body>
</html>
